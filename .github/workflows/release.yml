# Publishing a release (from the draft kept by release-drafter.yml) builds RestPeach and restpeach-cli for Windows
# and Linux with the release's version, checks that each build starts, builds the app's installers
# (restpeach-windows-x64-setup.exe and the install.sh in the Linux archive), checks that they install and uninstall, and
# attaches everything to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write  # upload the builds to the release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test -c Release
      - name: Build the portable exes
        shell: cmd
        # v1.2.3 -> 1.2.3, stamped into both exes (About and --version show it).
        run: |
          set TAG=${{ github.event.release.tag_name }}
          call build.cmd %TAG:v=%
      - name: Check that they start
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $v = & dist/restpeach-cli.exe --version
          if ($v -ne "restpeach-cli $($env:TAG.TrimStart('v'))") { throw "restpeach-cli --version says '$v'" }
          $p = Start-Process dist/RestPeach.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "RestPeach.exe exited at startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          & $iscc /Qp "/DAppVersion=$version" installer\RestPeach.iss
          if ($LASTEXITCODE) { throw "ISCC failed with code $LASTEXITCODE" }
      - name: Check that the installer installs, registers and uninstalls
        shell: pwsh
        run: |
          # Not Start-Process -Wait: it also waits for child processes, and the silent install leaves RestPeach running.
          $setup = Start-Process dist\restpeach-windows-x64-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "The installer did not finish in 5 minutes" }
          if ($setup.ExitCode -ne 0) { throw "The installer exited with code $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\RestPeach"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\RestPeach.lnk"
          foreach ($f in "$app\RestPeach.exe", "$app\installed.txt", "$app\unins000.exe", $lnk) {
            if (-not (Test-Path $f)) { throw "Missing after install: $f" }
          }
          # The silent install opens RestPeach (that is how an update restarts it): it must still be running.
          Start-Sleep -Seconds 15
          $p = Get-Process RestPeach -ErrorAction SilentlyContinue
          if (-not $p) { throw "RestPeach did not start after the silent install" }
          $p | Stop-Process -Force
          # The uninstaller hands over to a copy of itself in %TEMP% and exits at once, so poll for the result.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          $deadline = (Get-Date).AddMinutes(2)
          while (((Test-Path "$app\RestPeach.exe") -or (Test-Path $lnk)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ((Test-Path "$app\RestPeach.exe") -or (Test-Path $lnk)) { throw "Uninstall left files behind" }
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Descriptive names for the release; the exe itself (and the installed one) stays RestPeach.exe.
        run: |
          Copy-Item dist/RestPeach.exe dist/restpeach-windows-x64-portable.exe
          Copy-Item dist/restpeach-cli.exe dist/restpeach-cli-windows-x64.exe
          gh release upload "${{ github.event.release.tag_name }}" dist/restpeach-windows-x64-portable.exe dist/restpeach-windows-x64-setup.exe dist/restpeach-cli-windows-x64.exe --clobber

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test -c Release
      - name: Build the portable binaries
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./build.sh "${TAG#v}"
      - name: Check that they start
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(dist/restpeach-cli --version)
          if [ "$v" != "restpeach-cli ${TAG#v}" ]; then echo "::error::restpeach-cli --version says '$v'"; exit 1; fi
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxi6 libxrandr2 libxcursor1
          # Still running after 15 s means it started; timeout then stops it with code 124.
          set +e
          xvfb-run -a timeout 15 dist/RestPeach
          code=$?
          if [ $code -ne 124 ]; then echo "::error::RestPeach exited at startup with code $code"; exit 1; fi
      - name: Package them (the app with its installer)
        run: |
          cp installer/linux/install.sh installer/linux/uninstall.sh installer/installed.txt dist/
          cp src/RestPeach/Assets/logo.png dist/restpeach.png
          chmod +x dist/install.sh dist/uninstall.sh
          tar -czf restpeach-linux-x64.tar.gz -C dist RestPeach install.sh uninstall.sh installed.txt restpeach.png
          tar -czf restpeach-cli-linux-x64.tar.gz -C dist restpeach-cli
      - name: Check that install.sh and uninstall.sh work
        run: |
          mkdir -p /tmp/rp && tar -xzf restpeach-linux-x64.tar.gz -C /tmp/rp
          /tmp/rp/install.sh
          test -x ~/.local/opt/restpeach/RestPeach
          test -f ~/.local/opt/restpeach/installed.txt
          test -f ~/.local/share/applications/restpeach.desktop
          test -f ~/.local/share/icons/hicolor/256x256/apps/restpeach.png
          test -L ~/.local/bin/restpeach
          if command -v desktop-file-validate >/dev/null; then desktop-file-validate ~/.local/share/applications/restpeach.desktop; fi
          ~/.local/opt/restpeach/uninstall.sh
          test ! -e ~/.local/opt/restpeach
          test ! -e ~/.local/share/applications/restpeach.desktop
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" restpeach-linux-x64.tar.gz restpeach-cli-linux-x64.tar.gz --clobber
